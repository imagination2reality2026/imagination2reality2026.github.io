     .result-score-container {
    position: relative;
    width: 200px;
    height: 120px;
    margin: 20px auto;
}

.result-score-container svg {
    display: block;
}

.result-score-text {
    position: absolute;
    bottom: 0px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    font-weight: 700;
    color: #0d7377;
    font-family: 'Open Sans', sans-serif;
}

.result-score-label {
    text-align: center;
    font-size: 18px;
    color: #666;
    margin-top: 10px;
    margin-bottom: 20px;
}
        
.score-arc-bg,
.score-arc-fill,
.score-arc-center {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    box-sizing: border-box;
}

/* 底层灰色背景 */
.score-arc-bg {
    top: 0;
    left: 0;
    border: 12px solid #e0e0e0;
    border-bottom-color: transparent;
    border-right-color: transparent;
    transform: rotate(-45deg);
}

/* 上层绿色进度 - 初始状态隐藏 */
.score-arc-fill {
    top: 0;
    left: 0;
    border: 12px solid transparent;
    border-bottom-color: #4caf50;
    border-right-color: #4caf50;
    transform: rotate(-45deg); /* 0%时完全隐藏 */
    transition: transform 0.8s ease, border-color 0.3s ease;
}

/* 中心遮罩，形成环形效果 */
.score-arc-center {
    top: 12px;
    left: 12px;
    width: 176px;
    height: 176px;
    background: white;
    border-radius: 50%;
}

.result-score-text {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    font-weight: 700;
    color: #0d7377;
    font-family: 'Open Sans', sans-serif;
    z-index: 10;
}

let userCity = 'Unknown';
let userCountry = 'Unknown';
let locationReady = false;

function getUserLocation() {
    return new Promise((resolve) => {
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                userCity = data.city || data.region || 'Unknown';
                userCountry = data.country_name || 'Unknown';
                locationReady = true;
                console.log('📍 用户位置:', userCity, ',', userCountry);
                resolve();
            })
            .catch(error => {
                console.log('ipapi 失败，尝试备用方案:', error);
                fetch('https://ipinfo.io/json')
                    .then(response => response.json())
                    .then(data => {
                        userCity = data.city || 'Unknown';
                        userCountry = data.country || 'Unknown';
                        locationReady = true;
                        console.log('📍 备用位置:', userCity, ',', userCountry);
                        resolve();
                    })
                    .catch(() => {
                        console.log('位置获取失败，使用默认值');
                        resolve();
                    });
            });
    });
}

// 生成/获取用户唯一ID
function getUserId() {
    let uid = localStorage.getItem('practice_user_id');
    if (!uid) {
        uid = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('practice_user_id', uid);
    }
    return uid;
}

function submitToGoogleSheets(correctCount, percentage) {
    if (!GOOGLE_SCRIPT_URL) {
        console.log('Google Sheets URL未配置，跳过上报');
        return;
    }
    
    const userId = getUserId();
    const timestamp = new Date().toLocaleString('zh-CN', { 
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    }).replace(/\//g, '-');
    const totalQuestions = currentSet ? currentSet.questions.length : 10;
    
    // 收集错题题号
    const wrongQuestions = [];
    if (currentSet && currentSet.questions) {
        currentSet.questions.forEach(function(q, idx) {
            const isCorrect = checkAnswer(idx);
            if (!isCorrect) {
                wrongQuestions.push(idx + 1);
            }
        });
    }
    
    const wrongQuestionsStr = wrongQuestions.length > 0 
        ? wrongQuestions.join(', ') 
        : '无';
    
    // 构建上报数据
    const params = new URLSearchParams();
    params.append('userId', userId);
    params.append('timestamp', timestamp);
    params.append('setId', String(currentSetId));
    params.append('totalQuestions', String(totalQuestions));
    params.append('correctCount', String(correctCount));
    params.append('wrongCount', String(totalQuestions - correctCount));
    params.append('score', String(percentage));
    params.append('timeSpent', String(400 - timeRemaining));
    params.append('wrongQuestions', wrongQuestionsStr);
    params.append('city', userCity);
    params.append('country', userCountry);
    
    // 使用图片请求发送（避免CORS预检）
    const img = new Image();
    img.src = GOOGLE_SCRIPT_URL + '?' + params.toString();
    
    console.log('✅ 练习数据已上报:', {
        userId: userId,
        setId: currentSetId,
        score: percentage + '%',
        wrongQuestions: wrongQuestionsStr,
        city: userCity,
        country: userCountry
    });

// 初始化分类练习网格

    const grid = document.getElementById('categoryGrid');

// 开始具体某套分类练习
function startCategorySet(categoryKey, setIndex) {
    const config = categoryConfig[categoryKey];
    const questionIds = config.sets[setIndex];
    
    // 从全局套题中抽取题目
    const selectedQuestions = questionIds.map(id => {
        const [setId, qId] = id.split('-').map(Number);
        if (setId > allSetsData.length || !allSetsData[setId - 1]) {
            console.error('Invalid set ID:', setId);
            return null;
        }
        const question = allSetsData[setId - 1].questions[qId - 1];
        if (!question) {
            console.error('Invalid question ID:', qId, 'in set', setId);
            return null;
        }
        // 返回题目副本，避免修改原题
        return JSON.parse(JSON.stringify(question));
    }).filter(q => q !== null);
    
    // 创建临时套题
    currentSetId = `cat-${categoryKey}-${setIndex + 1}`;
    currentSet = {
        id: currentSetId,
        name: `${config.name} Set ${setIndex + 1}`,
        questions: selectedQuestions
    };
    
    // 重置状态
    currentQuestion = 0;
    userAnswers = new Array(selectedQuestions.length).fill(null).map(() => []);
    submitted = false;
    timeRemaining = 410;
    timerVisible = true;
    
    // 显示套题编号
    document.getElementById('setNumberDisplay').textContent = `${config.name} Set ${setIndex + 1}`;
    
    // 进入答题页面
    document.getElementById('homePage').style.display = 'none';
    document.getElementById('quizPageContainer').style.display = 'block';
    loadQuestion(0);
    startTimer();
    updateNavButtons();
}

        function handleDragStart(e) {
            draggedElement = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', e.target.dataset.word);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedElement = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.closest('.blank-container').classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.closest('.blank-container').classList.remove('drag-over');
        }

        function fillNextBlank(word, qIndex, optionElement) {
            const slots = document.querySelectorAll('.blank-slot');
            for (let i = 0; i < slots.length; i++) {
                const slot = slots[i];
                if (!slot.textContent) {
                    const blankId = slot.dataset.blankId;
                    const parts = blankId.split('-');
                    const blankIndex = parseInt(parts[1]);
                    slot.textContent = word;
                    slot.classList.add('filled');
                    userAnswers[qIndex][blankIndex] = word;
                    optionElement.classList.add('used');
                    break;
                }
            }
        }

        function returnWordToOptions(word, qIndex) {
            const options = document.querySelectorAll('.word-option');
            options.forEach(function(opt) {
                if (opt.dataset.word === word && opt.classList.contains('used')) {
                    opt.classList.remove('used');
                }
            });
        }

        function markOptionAsUsed(word, qIndex) {
            const options = document.querySelectorAll('.word-option');
            for (let i = 0; i < options.length; i++) {
                const opt = options[i];
                if (opt.dataset.word === word && !opt.classList.contains('used')) {
                    opt.classList.add('used');
                    break;
                }
            }
        }

            currentSet.questions.forEach(function(q, idx) {
                const item = document.createElement('div');
                item.className = 'review-item';
                item.style.cursor = 'pointer';
                item.onclick = function() {
                    if (!submitted) {
                        loadQuestion(idx);
                    }
                };
                const isAnswered = userAnswers[idx] && userAnswers[idx].some(function(a) { return a !== null; });
                const isCorrect = submitted ? checkAnswer(idx) : null;
                let statusClass = 'status-unanswered';
                let statusText = 'Unanswered';
                if (submitted) {
                    if (isCorrect) { statusClass = 'status-correct'; statusText = 'Correct'; }
                    else { statusClass = 'status-wrong'; statusText = 'Incorrect'; }
                } else if (isAnswered) {
                    statusText = 'Answered';
                }
                let userSentence = buildSentence(idx);
                let correctSentence = buildCorrectSentence(idx);
                item.innerHTML = '<div class="review-header"><strong>Question ' + (idx + 1) + '</strong><span class="review-status ' + statusClass + '">' + statusText + '</span></div>' +
                    '<div class="review-answer"><p><strong>Q:</strong> ' + q.question + '</p>' +
                    '<p><strong>Your answer:</strong> <span class="user-answer">' + (userSentence || '(Unanswered)') + '</span></p>' +
                    (submitted ? '<p><strong>Correct answer:</strong> <span class="correct-answer">' + correctSentence + '</span></p>' : '') + '</div>';
                reviewContent.appendChild(item);
            });
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('reviewArea').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';
        }

        function buildSentence(qIndex) {
            const q = currentSet.questions[qIndex];
            let sentence = [];
            let blankIdx = 0;
            for (let i = 0; i < q.correctAnswer.length; i++) {
                if (q.fixedPositions.indexOf(i) >= 0) {
                    sentence.push(q.correctAnswer[i]);
                } else {
                    sentence.push(userAnswers[qIndex][blankIdx] || '___');
                    blankIdx++;
                }
            }
            return sentence.join(' ') + (q.endingPunctuation || '.');
        }

        function buildCorrectSentence(qIndex) {
            const q = currentSet.questions[qIndex];
            return q.correctAnswer.join(' ') + (q.endingPunctuation || '.');
        }

        function backToQuiz() {
            // 不再需要，review界面点击题目直接跳转
        }

                function submitAll() {
  if (submitted) {
                console.log('已经提交过了');
                return;
            }

            submitted = true;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            let correct = 0;
            const resultCompare = document.getElementById('resultCompare');
            resultCompare.innerHTML = '';
            currentSet.questions.forEach(function(q, idx) {
                const isCorrect = checkAnswer(idx);
                if (isCorrect) correct++;
                const userSentence = buildSentence(idx);
                const correctSentence = buildCorrectSentence(idx);
                               const item = document.createElement('div');
                item.className = 'result-compare-item' + (isCorrect ? '' : ' wrong-item');
                item.dataset.correct = isCorrect ? 'true' : 'false';
                item.dataset.index = idx;
                item.dataset.correct = isCorrect ? 'true' : 'false';
                item.dataset.index = idx;
                item.innerHTML = '<div class="result-compare-header"><strong>Question ' + (idx + 1) + '</strong><span style="color: ' + (isCorrect ? '#4caf50' : '#f44336') + '; font-weight: 600;">' + (isCorrect ? '&#10003; Correct' : '&#10007; Wrong') + '</span></div>' +
                    '<div class="result-compare-body"><div class="q-text"><strong>Q:</strong> ' + q.question + '</div>' +
                    '<div class="ans-row"><div class="ans-box yours"><div class="ans-label">Your Answer</div><div class="ans-text ' + (isCorrect ? '' : 'wrong-text') + '">' + (userSentence || '(Unanswered)') + '</div></div>' +
                    '<div class="ans-box correct"><div class="ans-label">Correct Answer</div><div class="ans-text correct-text">' + correctSentence + '</div></div></div></div>';
                resultCompare.appendChild(item);
            });
            const percentage = Math.round((correct / 10) * 100);
            document.getElementById('scoreDisplayText').textContent = percentage + '%';            

        // 更新半圆进度环
const scoreArc = document.getElementById('scoreArc');
const totalLength = 251.2;
const fillLength = (percentage / 100) * totalLength;

scoreArc.setAttribute('stroke-dasharray', fillLength + ' ' + totalLength);    

// 设置颜色：0%灰色，>0%绿色
// 更新颜色
if (percentage === 0) {
    scoreArc.setAttribute('stroke', '#e0e0e0');
    document.getElementById('scoreDisplayText').style.color = '#9e9e9e';
} else {
    scoreArc.setAttribute('stroke', '#0d7377');
    document.getElementById('scoreDisplayText').style.color = '#0d7377';
}

            userProgress[currentSetId] = { completed: true, score: percentage, answered: 10, correct: correct };
            localStorage.setItem('toefl_progress', JSON.stringify(userProgress));
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('reviewArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
            
            // 默认显示全部，激活Show All按钮
            showAllResults();
            document.getElementById('reviewBtn').onclick = showReviewWithAnswers;
            // Google Sheets
            submitToGoogleSheets(correct, percentage);
        }

        function showAllResults() {
            const items = document.querySelectorAll('.result-compare-item');
            items.forEach(function(item) {
                item.style.display = 'block';
            });
            document.getElementById('showAllBtn').classList.add('active');
            document.getElementById('showWrongBtn').classList.remove('active');
        }

        function showWrongOnly() {
            const items = document.querySelectorAll('.result-compare-item');
            items.forEach(function(item) {
                if (item.dataset.correct === 'true') {
                    item.style.display = 'none';
                } else {
                    item.style.display = 'block';
                }
            });
            document.getElementById('showAllBtn').classList.remove('active');
            document.getElementById('showWrongBtn').classList.add('active');
        }

        function showWrongOnly() {
            const items = document.querySelectorAll('.result-compare-item');
            items.forEach(function(item) {
                if (item.dataset.correct === 'true') {
                    item.style.display = 'none';
                } else {
                    item.style.display = 'block';
                }
            });
            document.getElementById('showAllBtn').classList.remove('active');
            document.getElementById('showWrongBtn').classList.add('active');
        }


        function checkAnswer(idx) {
            const q = currentSet.questions[idx];
            const userAns = userAnswers[idx];
            
            // 检查是否有任何空未填
            if (!userAns || userAns.some(function(a) { 
                return a === null || a === undefined || a === ''; 
            })) {
                return false;
            }
            
            let blankIdx = 0;
            for (let i = 0; i < q.correctAnswer.length; i++) {
                if (q.fixedPositions.indexOf(i) < 0) {
                    // 必须比较，没填也判错
                    if (!userAns[blankIdx] || !q.correctAnswer[i] || 
                        userAns[blankIdx].toLowerCase() !== q.correctAnswer[i].toLowerCase()) {
                        return false;
                    }
                    blankIdx++;
                }
            }
            return true;
        }

        function showReviewWithAnswers() {
            showReview();
        }

        function restartTest() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            currentQuestion = 0;
            userAnswers = new Array(10).fill(null).map(function() { return []; });
            submitted = false;
            timeRemaining = 410;
            timerVisible = true;
            document.getElementById('reviewBtn').onclick = showReview;
            loadQuestion(0);
            startTimer();
            updateNavButtons();
        }

        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            updateTimerDisplay();
            timerInterval = setInterval(function() {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    submitAll();
                    return;
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            if (!timerVisible) {
                document.getElementById('timerDisplay').textContent = '';
                return;
            }
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            document.getElementById('timerDisplay').textContent = '00:' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        function toggleTimer() {
            timerVisible = !timerVisible;
            document.getElementById('hideTimerText').textContent = timerVisible ? 'Hide Time' : 'Show Time';
            updateTimerDisplay();
        }

        window.onload = function() {
            initHome();
        };
    </script>
